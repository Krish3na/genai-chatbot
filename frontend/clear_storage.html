<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Storage - GenAI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .button {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        .button:hover {
            background: #0056b3;
        }
        .success {
            color: green;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🧹 Clear Browser Storage</h1>
    <p>This will clear all stored sessions and cached data to fix login issues.</p>
    
    <button class="button" onclick="clearAllStorage()">Clear Storage & Redirect to Login</button>
    
    <div id="status"></div>

    <script>
        function clearAllStorage() {
            try {
                // Clear localStorage
                localStorage.clear();
                
                // Clear sessionStorage
                sessionStorage.clear();
                
                // Clear any cookies (if any)
                document.cookie.split(";").forEach(function(c) { 
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
                });
                
                document.getElementById('status').innerHTML = '<div class="success">✅ Storage cleared successfully! Redirecting to login...</div>';
                
                // Force reload and redirect
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
                
            } catch (error) {
                console.error('Error clearing storage:', error);
                document.getElementById('status').innerHTML = '<div style="color: red;">❌ Error clearing storage. Please manually clear your browser cache.</div>';
            }
        }
        
        // Auto-clear on load if requested
        if (window.location.search.includes('auto=true')) {
            clearAllStorage();
        }
    </script>
</body>
</html>
