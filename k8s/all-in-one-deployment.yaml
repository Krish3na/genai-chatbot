# All-in-One GenAI Chatbot Kubernetes Deployment
# Deploy with: kubectl apply -f k8s/all-in-one-deployment.yaml

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: genai-chatbot
  labels:
    name: genai-chatbot

---
# ConfigMap for application settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: genai-chatbot-config
  namespace: genai-chatbot
data:
  OPENAI_MODEL: "gpt-4"
  OPENAI_TEMPERATURE: "0.7"
  OPENAI_MAX_TOKENS: "1000"
  MLFLOW_TRACKING_URI: "http://mlflow-service:5000"
  MLFLOW_ENABLED: "true"
  PROMETHEUS_ENABLED: "true"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  CHROMA_PERSIST_DIRECTORY: "/app/chroma_db"
  DATA_DIR: "/app/data/documents"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: genai-chatbot-secrets
  namespace: genai-chatbot
type: Opaque
stringData:
  # Replace with your actual OpenAI API key when deploying
  OPENAI_API_KEY: "REPLACE_WITH_YOUR_ACTUAL_KEY"

---
# Main GenAI Chatbot Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-chatbot
  namespace: genai-chatbot
  labels:
    app: genai-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genai-chatbot
  template:
    metadata:
      labels:
        app: genai-chatbot
    spec:
      containers:
      - name: genai-chatbot
        image: genai-chatbot:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: genai-chatbot-secrets
              key: OPENAI_API_KEY
        - name: OPENAI_MODEL
          valueFrom:
            configMapKeyRef:
              name: genai-chatbot-config
              key: OPENAI_MODEL
        - name: OPENAI_TEMPERATURE
          valueFrom:
            configMapKeyRef:
              name: genai-chatbot-config
              key: OPENAI_TEMPERATURE
        - name: OPENAI_MAX_TOKENS
          valueFrom:
            configMapKeyRef:
              name: genai-chatbot-config
              key: OPENAI_MAX_TOKENS
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            configMapKeyRef:
              name: genai-chatbot-config
              key: MLFLOW_TRACKING_URI
        - name: MLFLOW_ENABLED
          valueFrom:
            configMapKeyRef:
              name: genai-chatbot-config
              key: MLFLOW_ENABLED
        - name: PROMETHEUS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: genai-chatbot-config
              key: PROMETHEUS_ENABLED
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
# GenAI Chatbot Service
apiVersion: v1
kind: Service
metadata:
  name: genai-chatbot-service
  namespace: genai-chatbot
  labels:
    app: genai-chatbot
spec:
  selector:
    app: genai-chatbot
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP

---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: genai-chatbot
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--storage.tsdb.retention.time=200h'
          - '--web.enable-lifecycle'
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: genai-chatbot
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
  - name: web
    port: 9090
    targetPort: 9090
  type: ClusterIP

---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: genai-chatbot
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'genai-chatbot'
        static_configs:
          - targets: ['genai-chatbot-service:80']
        metrics_path: '/metrics'
        scrape_interval: 5s

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: genai-chatbot
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: genai-chatbot
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
  - name: web
    port: 3000
    targetPort: 3000
  type: ClusterIP
