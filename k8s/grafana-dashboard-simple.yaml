apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-simple
  namespace: genai-chatbot
  labels:
    grafana_dashboard: "1"
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /etc/grafana/provisioning/dashboards

  genai-chatbot-simple-dashboard.json: |
    {
      "title": "GenAI Chatbot - Simple Dashboard",
      "tags": ["genai", "chatbot", "simple"],
      "style": "dark",
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Total Requests",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(genai_chatbot_chat_request_duration_seconds_count)",
              "legendFormat": "Total Requests"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1000}
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "title": "Token Usage",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(genai_chatbot_tokens_used_total)",
              "legendFormat": "Total Tokens"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 10000}
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          }
        }
      ]
    }
