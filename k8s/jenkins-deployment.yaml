apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      containers:
      - name: jenkins
        image: jenkins/jenkins:lts-jdk17
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 50000
          name: jnlp
        env:
        - name: JAVA_OPTS
          value: "-Djenkins.install.runSetupWizard=false"
        - name: JENKINS_OPTS
          value: "--prefix=/jenkins"
        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home
        - name: jenkins-config
          mountPath: /var/jenkins_home/init.groovy.d/
          subPath: init.groovy
        - name: jenkins-webhook-config
          mountPath: /var/jenkins_home/init.groovy.d/
          subPath: webhook.groovy
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: kubectl-config
          mountPath: /root/.kube
        - name: tools-script
          mountPath: /usr/local/bin/setup-tools.sh
          subPath: setup-tools.sh
        command: ["/bin/bash"]
        args: ["-c", "apt-get update && apt-get install -y python3 python3-pip curl git && chmod +x /usr/local/bin/setup-tools.sh && /usr/local/bin/setup-tools.sh && /usr/local/bin/jenkins.sh"]
      volumes:
      - name: jenkins-home
        persistentVolumeClaim:
          claimName: jenkins-pvc
      - name: jenkins-config
        configMap:
          name: jenkins-config
      - name: jenkins-webhook-config
        configMap:
          name: jenkins-webhook-config
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
      - name: kubectl-config
        hostPath:
          path: /root/.kube
      - name: tools-script
        configMap:
          name: jenkins-tools-config 