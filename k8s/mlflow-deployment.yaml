apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: genai-chatbot
  labels:
    app: mlflow-server
    component: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-server
  template:
    metadata:
      labels:
        app: mlflow-server
        component: mlflow
    spec:
      containers:
      - name: mlflow-server
        image: python:3.11-slim
        ports:
        - containerPort: 5000
          name: mlflow-port
        command:
        - /bin/bash
        - -c
        - |
          pip install mlflow==2.8.1 &&
          mlflow server \
            --backend-store-uri sqlite:///mlflow/mlflow.db \
            --default-artifact-root /mlflow/artifacts \
            --host 0.0.0.0 \
            --port 5000
        volumeMounts:
        - name: mlflow-data
          mountPath: /mlflow
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://localhost:5000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 120
          periodSeconds: 30
      volumes:
      - name: mlflow-data
        persistentVolumeClaim:
          claimName: mlflow-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: genai-chatbot
  labels:
    app: mlflow-server
spec:
  selector:
    app: mlflow-server
  ports:
  - port: 5000
    targetPort: 5000
    name: mlflow-port
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-pvc
  namespace: genai-chatbot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

