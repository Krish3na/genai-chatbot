global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'genai-chatbot'
    static_configs:
      - targets: ['genai-chatbot:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s  # Reduced frequency to reduce log noise

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

